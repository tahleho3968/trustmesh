[package]
name = "trustmesh-api"
description = "REST API for issuing and verifying W3C Verifiable Credentials."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trustmesh-crypto.workspace = true
trustmesh-credentials.workspace = true
trustmesh-issuer.workspace = true
trustmesh-verifier.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = "0.5"
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
anyhow = "1"

[lints]
workspace = true
