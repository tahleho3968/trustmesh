[workspace]
resolver = "2"
members = [
    "crates/trustmesh-crypto",
    "crates/trustmesh-credentials",
    "crates/trustmesh-issuer",
    "crates/trustmesh-verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tahleho3968/trustmesh"

[workspace.dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
bs58 = "0.5"
getrandom = "0.3"
serde_jcs = "0.2"
trustmesh-crypto = { path = "crates/trustmesh-crypto" }
trustmesh-credentials = { path = "crates/trustmesh-credentials" }
trustmesh-issuer = { path = "crates/trustmesh-issuer" }
trustmesh-verifier = { path = "crates/trustmesh-verifier" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

[workspace.lints.rust]
unsafe_code = "forbid"
